name: Build wdi-simple

on:
  workflow_dispatch:
    inputs:
      libwdi_ref:
        description: "libwdi tag/branch/commit"
        required: true
        default: "v1.5.1"

permissions:
  contents: write

env:
  LIBUSB0_URL: https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.0/libusb-win32-bin-1.4.0.0.zip
  LIBUSBK_URL: https://github.com/mcuee/libusbk/releases/download/V3.1.0.0/libusbK-3.1.0.0-bin.7z

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ============================================================
      # Checkout libwdi
      # ============================================================

      - name: Checkout libwdi
        uses: actions/checkout@v5
        with:
          repository: pbatard/libwdi
          ref: ${{ inputs.libwdi_ref }}
          fetch-depth: 1

      # ============================================================
      # Show installed Windows Kits
      # ============================================================

      - name: Inspect Windows Kits
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "Windows Kits installed on runner"
          Write-Host "========================================"

          $kitsRoot = "C:\Program Files (x86)\Windows Kits"

          if (-not (Test-Path $kitsRoot)) {
              throw "Windows Kits directory not found: $kitsRoot"
          }

          Get-ChildItem $kitsRoot -Directory |
              ForEach-Object {
                  Write-Host $_.FullName
              }

          Write-Host ""
          Write-Host "Searching for WdfCoInstaller01011.dll..."

          $wdfCandidates = Get-ChildItem `
              -Path $kitsRoot `
              -Filter "WdfCoInstaller01011.dll" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

          if ($wdfCandidates) {
              $wdfCandidates |
                  ForEach-Object {
                      Write-Host $_.FullName
                  }
          }
          else {
              Write-Warning "WdfCoInstaller01011.dll was not found under Windows Kits."
          }

          Write-Host ""
          Write-Host "Searching for winusbcoinstaller2.dll..."

          $winusbCandidates = Get-ChildItem `
              -Path $kitsRoot `
              -Filter "winusbcoinstaller2.dll" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

          if ($winusbCandidates) {
              $winusbCandidates |
                  ForEach-Object {
                      Write-Host $_.FullName
                  }
          }
          else {
              Write-Warning "winusbcoinstaller2.dll was not found under Windows Kits."
          }

      # ============================================================
      # Download and prepare libusb dependencies
      # ============================================================

      - name: Download and prepare dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "Downloading dependencies"
          Write-Host "========================================"

          # ----------------------------------------------------------
          # Download libusb-win32
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Downloading libusb-win32..."

          Invoke-WebRequest `
            -Uri $env:LIBUSB0_URL `
            -OutFile libusb0-redist.zip

          # ----------------------------------------------------------
          # Download libusbK
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Downloading libusbK..."

          Invoke-WebRequest `
            -Uri $env:LIBUSBK_URL `
            -OutFile libusbk-redist.7z

          # ----------------------------------------------------------
          # Create directories
          # ----------------------------------------------------------

          New-Item `
            -ItemType Directory `
            -Force `
            -Path libusb0-archive |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path libusbk-archive |
            Out-Null

          # ----------------------------------------------------------
          # Extract libusb-win32
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Extracting libusb-win32..."

          7z x `
            libusb0-redist.zip `
            -olibusb0-archive `
            -y

          # ----------------------------------------------------------
          # Extract libusbK
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Extracting libusbK..."

          7z x `
            libusbk-redist.7z `
            -olibusbk-archive `
            -y

          # ----------------------------------------------------------
          # Normalize libusb-win32
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Normalizing libusb-win32 directory..."

          $libusb0Root = Get-ChildItem `
            -Path libusb0-archive `
            -Directory |
            Select-Object -First 1

          if (-not $libusb0Root) {
              throw "Could not find extracted libusb-win32 directory."
          }

          if (Test-Path libusb0) {
              Remove-Item `
                libusb0 `
                -Recurse `
                -Force
          }

          Move-Item `
            $libusb0Root.FullName `
            libusb0

          # ----------------------------------------------------------
          # Locate libusbK.sys
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Searching for libusbK.sys..."

          $libusbKFiles = Get-ChildItem `
            -Path libusbk-archive `
            -Filter "libusbK.sys" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $libusbKFiles) {

              Write-Host ""
              Write-Host "Files contained in libusbK archive:"

              Get-ChildItem `
                -Path libusbk-archive `
                -Recurse `
                -File |
                Select-Object -ExpandProperty FullName

              throw "libusbK.sys not found in libusbK archive."
          }

          Write-Host ""
          Write-Host "Found libusbK.sys:"

          $libusbKFiles |
              ForEach-Object {
                  Write-Host $_.FullName
              }

          # ----------------------------------------------------------
          # Locate x86 / amd64 drivers
          # ----------------------------------------------------------

          $x86Sys = $libusbKFiles |
            Where-Object {
                $_.FullName -match '(?i)[\\/]x86[\\/][^\\/]*libusbK\.sys$'
            } |
            Select-Object -First 1

          $amd64Sys = $libusbKFiles |
            Where-Object {
                $_.FullName -match '(?i)[\\/](amd64|x64)[\\/][^\\/]*libusbK\.sys$'
            } |
            Select-Object -First 1

          if (-not $x86Sys) {
              Write-Warning "x86 libusbK.sys was not detected by path."
          }

          if (-not $amd64Sys) {
              Write-Warning "amd64 libusbK.sys was not detected by path."
          }

          # ----------------------------------------------------------
          # Locate libusbK.dll
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Searching for libusbK.dll..."

          $libusbKDlls = Get-ChildItem `
            -Path libusbk-archive `
            -Filter "libusbK.dll" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($libusbKDlls) {
              $libusbKDlls |
                  ForEach-Object {
                      Write-Host $_.FullName
                  }
          }

          # ----------------------------------------------------------
          # Create normalized libusbK directory
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Creating normalized libusbK directory..."

          if (Test-Path libusbk) {
              Remove-Item `
                libusbk `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "libusbk\bin\sys\x86" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "libusbk\bin\sys\amd64" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "libusbk\bin\dll\x86" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "libusbk\bin\dll\amd64" |
            Out-Null

          # ----------------------------------------------------------
          # Copy x86 driver
          # ----------------------------------------------------------

          if ($x86Sys) {

              Copy-Item `
                $x86Sys.FullName `
                "libusbk\bin\sys\x86\libusbK.sys" `
                -Force

              Write-Host "Copied x86 libusbK.sys."
          }

          # ----------------------------------------------------------
          # Copy amd64 driver
          # ----------------------------------------------------------

          if ($amd64Sys) {

              Copy-Item `
                $amd64Sys.FullName `
                "libusbk\bin\sys\amd64\libusbK.sys" `
                -Force

              Write-Host "Copied amd64 libusbK.sys."
          }

          # ----------------------------------------------------------
          # Fallback search for x86
          # ----------------------------------------------------------

          if (-not (Test-Path "libusbk\bin\sys\x86\libusbK.sys")) {

              $fallbackX86 = $libusbKFiles |
                Where-Object {
                    $_.FullName -match '(?i)(x86|32)'
                } |
                Select-Object -First 1

              if ($fallbackX86) {

                  Copy-Item `
                    $fallbackX86.FullName `
                    "libusbk\bin\sys\x86\libusbK.sys" `
                    -Force

                  Write-Host "Copied x86 driver using fallback detection."
              }
          }

          # ----------------------------------------------------------
          # Fallback search for amd64
          # ----------------------------------------------------------

          if (-not (Test-Path "libusbk\bin\sys\amd64\libusbK.sys")) {

              $fallbackAMD64 = $libusbKFiles |
                Where-Object {
                    $_.FullName -match '(?i)(amd64|x64|64)'
                } |
                Select-Object -First 1

              if ($fallbackAMD64) {

                  Copy-Item `
                    $fallbackAMD64.FullName `
                    "libusbk\bin\sys\amd64\libusbK.sys" `
                    -Force

                  Write-Host "Copied amd64 driver using fallback detection."
              }
          }

          # ----------------------------------------------------------
          # Copy DLLs
          # ----------------------------------------------------------

          foreach ($dll in $libusbKDlls) {

              if ($dll.FullName -match '(?i)[\\/]x86[\\/]') {

                  Copy-Item `
                    $dll.FullName `
                    "libusbk\bin\dll\x86\libusbK.dll" `
                    -Force

                  Write-Host "Copied x86 libusbK.dll."
              }
              elseif ($dll.FullName -match '(?i)[\\/](amd64|x64)[\\/]') {

                  Copy-Item `
                    $dll.FullName `
                    "libusbk\bin\dll\amd64\libusbK.dll" `
                    -Force

                  Write-Host "Copied amd64 libusbK.dll."
              }
          }

          # ----------------------------------------------------------
          # Validate libusbK
          # ----------------------------------------------------------

          if (-not (Test-Path "libusbk\bin\sys\x86\libusbK.sys")) {
              throw "Normalized x86 libusbK.sys is missing."
          }

          if (-not (Test-Path "libusbk\bin\sys\amd64\libusbK.sys")) {
              throw "Normalized amd64 libusbK.sys is missing."
          }

          Write-Host ""
          Write-Host "libusbK normalization completed successfully."

      # ============================================================
      # Prepare legacy WDK 8.0 paths required by libwdi
      # ============================================================

      - name: Prepare WDK 8 WDF redistributables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "Preparing WDF redistributables"
          Write-Host "========================================"

          $kitsRoot = "C:\Program Files (x86)\Windows Kits"

          if (-not (Test-Path $kitsRoot)) {
              throw "Windows Kits root not found: $kitsRoot"
          }

          # ----------------------------------------------------------
          # libwdi v1.5.1 expects this legacy location:
          #
          # C:\Program Files (x86)\Windows Kits\8.0\redist\wdf\x86
          # C:\Program Files (x86)\Windows Kits\8.0\redist\wdf\x64
          # ----------------------------------------------------------

          $legacyRoot = Join-Path `
            $kitsRoot `
            "8.0\redist\wdf"

          $legacyX86 = Join-Path `
            $legacyRoot `
            "x86"

          $legacyX64 = Join-Path `
            $legacyRoot `
            "x64"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $legacyX86 |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $legacyX64 |
            Out-Null

          # ----------------------------------------------------------
          # Find Microsoft WDF 1.11 co-installer
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Searching Windows Kits for WDF 1.11..."

          $wdfFiles = Get-ChildItem `
            -Path $kitsRoot `
            -Filter "WdfCoInstaller01011.dll" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $wdfFiles) {
              throw @"
WdfCoInstaller01011.dll was not found anywhere below:

$kitsRoot

The Windows runner does not currently contain the WDF 1.11 redistributable.
"@
          }

          Write-Host ""
          Write-Host "WDF candidates:"

          $wdfFiles |
              ForEach-Object {
                  Write-Host $_.FullName
              }

          # ----------------------------------------------------------
          # Find WinUSB co-installer
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Searching Windows Kits for WinUSB co-installer..."

          $winusbFiles = Get-ChildItem `
            -Path $kitsRoot `
            -Filter "winusbcoinstaller2.dll" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $winusbFiles) {
              throw @"
winusbcoinstaller2.dll was not found anywhere below:

$kitsRoot

The required WinUSB redistributable is missing.
"@
          }

          Write-Host ""
          Write-Host "WinUSB candidates:"

          $winusbFiles |
              ForEach-Object {
                  Write-Host $_.FullName
              }

          # ----------------------------------------------------------
          # Helper: determine architecture from path
          # ----------------------------------------------------------

          function Get-ArchitectureFromPath {
              param(
                  [string]$Path
              )

              if ($Path -match '(?i)[\\/]x86[\\/]') {
                  return "x86"
              }

              if ($Path -match '(?i)[\\/](x64|amd64)[\\/]') {
                  return "x64"
              }

              return $null
          }

          # ----------------------------------------------------------
          # Copy WDF co-installer
          # ----------------------------------------------------------

          foreach ($file in $wdfFiles) {

              $arch = Get-ArchitectureFromPath $file.FullName

              if ($arch -eq "x86") {

                  Copy-Item `
                    $file.FullName `
                    (Join-Path $legacyX86 "WdfCoInstaller01011.dll") `
                    -Force

                  Write-Host "Installed x86 WdfCoInstaller01011.dll"
              }

              elseif ($arch -eq "x64") {

                  Copy-Item `
                    $file.FullName `
                    (Join-Path $legacyX64 "WdfCoInstaller01011.dll") `
                    -Force

                  Write-Host "Installed x64 WdfCoInstaller01011.dll"
              }
          }

          # ----------------------------------------------------------
          # Copy WinUSB co-installer
          # ----------------------------------------------------------

          foreach ($file in $winusbFiles) {

              $arch = Get-ArchitectureFromPath $file.FullName

              if ($arch -eq "x86") {

                  Copy-Item `
                    $file.FullName `
                    (Join-Path $legacyX86 "winusbcoinstaller2.dll") `
                    -Force

                  Write-Host "Installed x86 winusbcoinstaller2.dll"
              }

              elseif ($arch -eq "x64") {

                  Copy-Item `
                    $file.FullName `
                    (Join-Path $legacyX64 "winusbcoinstaller2.dll") `
                    -Force

                  Write-Host "Installed x64 winusbcoinstaller2.dll"
              }
          }

          # ----------------------------------------------------------
          # Validation
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Validating legacy WDK paths..."

          $required = @(
              (Join-Path $legacyX86 "WdfCoInstaller01011.dll"),
              (Join-Path $legacyX64 "WdfCoInstaller01011.dll"),
              (Join-Path $legacyX86 "winusbcoinstaller2.dll"),
              (Join-Path $legacyX64 "winusbcoinstaller2.dll")
          )

          foreach ($file in $required) {

              if (-not (Test-Path $file)) {

                  Write-Host ""
                  Write-Host "ERROR: Missing:"
                  Write-Host $file

                  throw "Required WDF/WinUSB redistributable is missing."
              }

              Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "WDF redistributables prepared successfully."

      # ============================================================
      # MSBuild
      # ============================================================

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # Build libwdi
      # ============================================================

      - name: Build libwdi
        shell: cmd
        run: |
          msbuild libwdi.sln ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /m

      # ============================================================
      # Locate wdi-simple.exe
      # ============================================================

      - name: Verify wdi-simple.exe
        shell: pwsh
        run: |

          $exe = Get-ChildItem `
            -Path . `
            -Filter "wdi-simple.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $exe) {
              throw "wdi-simple.exe was not produced."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "wdi-simple.exe FOUND"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "Path:"
          Write-Host $exe.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host $exe.Length

          Write-Host ""
          Write-Host "Version information:"

          $exe.VersionInfo |
            Select-Object `
              FileVersion,
              ProductVersion,
              CompanyName,
              ProductName

      # ============================================================
      # SHA-256
      # ============================================================

      - name: Calculate SHA-256
        id: hash
        shell: pwsh
        run: |

          $exe = Get-ChildItem `
            -Path . `
            -Filter "wdi-simple.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $exe) {
              throw "wdi-simple.exe was not found."
          }

          $hash = (
            Get-FileHash `
              -Path $exe.FullName `
              -Algorithm SHA256
          ).Hash

          Write-Host ""
          Write-Host "SHA-256:"
          Write-Host $hash

          "sha256=$hash" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append

      # ============================================================
      # Copy release asset
      # ============================================================

      - name: Prepare release asset
        shell: pwsh
        run: |

          $exe = Get-ChildItem `
            -Path . `
            -Filter "wdi-simple.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $exe) {
              throw "wdi-simple.exe was not found."
          }

          Copy-Item `
            -Path $exe.FullName `
            -Destination "$env:GITHUB_WORKSPACE\wdi-simple.exe" `
            -Force

      # ============================================================
      # GitHub Release
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wdi-simple-${{ inputs.libwdi_ref }}-${{ github.run_number }}
          name: "wdi-simple ${{ inputs.libwdi_ref }} build #${{ github.run_number }}"
          generate_release_notes: true

          files: |
            wdi-simple.exe

          body: |
            Automated libwdi wdi-simple build.

            libwdi ref:
            ${{ inputs.libwdi_ref }}

            SHA-256:
            ${{ steps.hash.outputs.sha256 }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Final information
      # ============================================================

      - name: Print build information
        shell: pwsh
        run: |

          $exe = Join-Path `
            $env:GITHUB_WORKSPACE `
            "wdi-simple.exe"

          $hash = (
            Get-FileHash `
              -Path $exe `
              -Algorithm SHA256
          ).Hash

          Write-Host ""
          Write-Host "========================================"
          Write-Host "BUILD SUCCESSFUL"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "Release:"
          Write-Host "https://github.com/${{ github.repository }}/releases/tag/wdi-simple-${{ inputs.libwdi_ref }}-${{ github.run_number }}"

          Write-Host ""
          Write-Host "SHA-256:"
          Write-Host $hash
