name: Build wdi-simple

on:
  workflow_dispatch:
    inputs:
      libwdi_ref:
        description: "libwdi tag/branch/commit"
        required: true
        default: "v1.5.1"

permissions:
  contents: write

env:
  WDK_REDIST_URL: "https://go.microsoft.com/fwlink/p/?LinkID=253170"
  LIBUSB0_URL: "https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.0/libusb-win32-bin-1.4.0.0.zip"
  LIBUSBK_URL: "https://github.com/mcuee/libusbk/releases/download/V3.1.0.0/libusbK-3.1.0.0-bin.7z"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout libwdi
        uses: actions/checkout@v5
        with:
          repository: pbatard/libwdi
          ref: ${{ inputs.libwdi_ref }}
          fetch-depth: 1

      - name: Verify runner tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            throw '7z.exe is not available on windows-2022 runner.'
          }

          Write-Host "7-Zip: $((Get-Command 7z.exe).Source)"

      - name: Download dependency archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $files = @(
            @{ Url = $env:WDK_REDIST_URL; Path = 'wdk-redist.msi' }
            @{ Url = $env:LIBUSB0_URL; Path = 'libusb0-redist.zip' }
            @{ Url = $env:LIBUSBK_URL; Path = 'libusbk-redist.7z' }
          )

          foreach ($item in $files) {
            Write-Host "Downloading $($item.Path)..."
            Invoke-WebRequest -Uri $item.Url -OutFile (Join-Path $env:GITHUB_WORKSPACE $item.Path)
            $path = Join-Path $env:GITHUB_WORKSPACE $item.Path
            if (-not (Test-Path $path)) {
              throw "Download failed: $($item.Path)"
            }
            $size = (Get-Item $path).Length
            if ($size -lt 1024) {
              throw "Downloaded file is unexpectedly small: $($item.Path) ($size bytes)"
            }
            Write-Host "$($item.Path): $size bytes"
          }

      - name: Prepare all build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root = Join-Path $env:GITHUB_WORKSPACE 'dependencies'
          $wdkRoot = Join-Path $root 'wdk'
          $wdfRoot = Join-Path $wdkRoot 'redist\wdf'
          $wdkExtract = Join-Path $root 'wdk-msi-extracted'
          $wdkAdmin = Join-Path $root 'wdk-msi-admin-extracted'
          $libusb0Archive = Join-Path $root 'libusb0-archive'
          $libusb0Root = Join-Path $root 'libusb0'
          $libusbKArchive = Join-Path $root 'libusbk-archive'
          $libusbKRoot = Join-Path $root 'libusbk'

          foreach ($dir in @(
            $root, $wdkExtract, $wdkAdmin, $libusb0Archive, $libusbKArchive,
            (Join-Path $wdfRoot 'x86'), (Join-Path $wdfRoot 'x64'),
            (Join-Path $libusbKRoot 'bin\sys\x86'),
            (Join-Path $libusbKRoot 'bin\sys\amd64'),
            (Join-Path $libusbKRoot 'bin\dll\x86'),
            (Join-Path $libusbKRoot 'bin\dll\amd64')
          )) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }

          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source

          function Get-PeMachine([string]$Path) {
            $b = [System.IO.File]::ReadAllBytes($Path)
            if ($b.Length -lt 64 -or $b[0] -ne 0x4d -or $b[1] -ne 0x5a) {
              throw "Not a valid PE file: $Path"
            }
            $off = [BitConverter]::ToInt32($b, 0x3c)
            if ($off -lt 0 -or $off + 6 -ge $b.Length) {
              throw "Invalid PE header offset: $Path"
            }
            if ($b[$off] -ne 0x50 -or $b[$off+1] -ne 0x45 -or $b[$off+2] -ne 0 -or $b[$off+3] -ne 0) {
              throw "Invalid PE signature: $Path"
            }
            [BitConverter]::ToUInt16($b, $off + 4)
          }

          # --------------------------------------------------------
          # WDK 8 redistributables
          # Microsoft supplies these as wdfcoinstaller.msi. We do
          # not install it into the runner. We extract its payload
          # and build the exact WDK_DIR tree libwdi v1.5.1 expects.
          # --------------------------------------------------------

          $wdkMsi = Join-Path $env:GITHUB_WORKSPACE 'wdk-redist.msi'

          Write-Host 'Extracting WDK MSI with 7-Zip...'
          & $sevenZip x $wdkMsi "-o$wdkExtract" -y
          $sevenExit = $LASTEXITCODE

          $wdfCandidates = @()
          if (Test-Path $wdkExtract) {
            $wdfCandidates = @(Get-ChildItem $wdkExtract -Filter 'WdfCoInstaller01011.dll' -File -Recurse -ErrorAction SilentlyContinue)
          }

          # Fallback: administrative MSI extraction.
          if ($wdfCandidates.Count -eq 0) {
            Write-Host "7-Zip did not expose WDF DLLs (exit $sevenExit); running MSI administrative extraction..."
            $p = Start-Process -FilePath 'msiexec.exe' `
              -ArgumentList @('/a', $wdkMsi, '/qn', "TARGETDIR=$wdkAdmin") `
              -Wait -PassThru -NoNewWindow
            Write-Host "msiexec /a exit code: $($p.ExitCode)"

            if (Test-Path $wdkAdmin) {
              $wdfCandidates = @(Get-ChildItem $wdkAdmin -Filter 'WdfCoInstaller01011.dll' -File -Recurse -ErrorAction SilentlyContinue)
            }
          }

          $winusbCandidates = @()
          foreach ($source in @($wdkExtract, $wdkAdmin)) {
            if (Test-Path $source) {
              $winusbCandidates += @(Get-ChildItem $source -Filter 'WinUSBCoInstaller2.dll' -File -Recurse -ErrorAction SilentlyContinue)
            }
          }

          if ($wdfCandidates.Count -eq 0 -or $winusbCandidates.Count -eq 0) {
            Write-Host 'WDK extraction contents:'
            foreach ($source in @($wdkExtract, $wdkAdmin)) {
              if (Test-Path $source) {
                Get-ChildItem $source -Recurse -File -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName
              }
            }
            throw 'Could not extract the WDK 8 co-installer files from wdfcoinstaller.msi.'
          }

          $wdfX86 = $null
          $wdfX64 = $null
          foreach ($f in $wdfCandidates) {
            $m = Get-PeMachine $f.FullName
            if ($m -eq 0x014c -and -not $wdfX86) { $wdfX86 = $f }
            if ($m -eq 0x8664 -and -not $wdfX64) { $wdfX64 = $f }
          }

          $winusbX86 = $null
          $winusbX64 = $null
          foreach ($f in $winusbCandidates) {
            $m = Get-PeMachine $f.FullName
            if ($m -eq 0x014c -and -not $winusbX86) { $winusbX86 = $f }
            if ($m -eq 0x8664 -and -not $winusbX64) { $winusbX64 = $f }
          }

          if (-not $wdfX86 -or -not $wdfX64 -or -not $winusbX86 -or -not $winusbX64) {
            throw 'Missing x86/x64 WDF or WinUSB co-installer after WDK extraction.'
          }

          Copy-Item $wdfX86.FullName (Join-Path $wdfRoot 'x86\WdfCoInstaller01011.dll') -Force
          Copy-Item $wdfX64.FullName (Join-Path $wdfRoot 'x64\WdfCoInstaller01011.dll') -Force
          Copy-Item $winusbX86.FullName (Join-Path $wdfRoot 'x86\WinUSBCoInstaller2.dll') -Force
          Copy-Item $winusbX64.FullName (Join-Path $wdfRoot 'x64\WinUSBCoInstaller2.dll') -Force

          # --------------------------------------------------------
          # libusb-win32 1.4.0.0
          # --------------------------------------------------------

          Write-Host 'Extracting libusb-win32...'
          & $sevenZip x (Join-Path $env:GITHUB_WORKSPACE 'libusb0-redist.zip') "-o$libusb0Archive" -y
          if ($LASTEXITCODE -ne 0) {
            throw "libusb-win32 extraction failed with exit code $LASTEXITCODE"
          }

          $libusb0Dll = Get-ChildItem $libusb0Archive -Filter 'libusb0_x86.dll' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '(?i)[\\/]bin[\\/]x86[\\/]' } |
            Select-Object -First 1

          $libusb0Dll64 = Get-ChildItem $libusb0Archive -Filter 'libusb0.dll' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '(?i)[\\/]bin[\\/](amd64|x64)[\\/]' } |
            Select-Object -First 1

          if (-not $libusb0Dll -or -not $libusb0Dll64) {
            Get-ChildItem $libusb0Archive -Recurse -File |
              Select-Object -ExpandProperty FullName
            throw 'Could not locate x86/amd64 libusb-win32 binaries.'
          }

          $libusb0SourceRoot = $libusb0Dll.Directory.Parent.Parent
          if (-not (Test-Path (Join-Path $libusb0SourceRoot.FullName 'bin'))) {
            throw "Invalid libusb-win32 root: $($libusb0SourceRoot.FullName)"
          }

          Copy-Item $libusb0SourceRoot.FullName $libusb0Root -Recurse -Force

          foreach ($rel in @(
            'bin\x86\libusb0_x86.dll', 'bin\x86\libusb0.sys', 'bin\x86\install-filter.exe',
            'bin\amd64\libusb0.dll', 'bin\amd64\libusb0.sys', 'bin\amd64\install-filter.exe',
            'installer_license.txt'
          )) {
            $path = Join-Path $libusb0Root $rel
            if (-not (Test-Path $path)) {
              throw "Required libusb-win32 file missing: $path"
            }
          }

          # --------------------------------------------------------
          # libusbK 3.1.0.0
          # --------------------------------------------------------

          Write-Host 'Extracting libusbK...'
          & $sevenZip x (Join-Path $env:GITHUB_WORKSPACE 'libusbk-redist.7z') "-o$libusbKArchive" -y
          if ($LASTEXITCODE -ne 0) {
            throw "libusbK extraction failed with exit code $LASTEXITCODE"
          }

          $kX86Sys = Get-ChildItem $libusbKArchive -Filter 'libusbK.sys' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '(?i)[\\/]bin[\\/]sys[\\/]x86[\\/]libusbK\.sys$' } |
            Select-Object -First 1

          $kX64Sys = Get-ChildItem $libusbKArchive -Filter 'libusbK.sys' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '(?i)[\\/]bin[\\/]sys[\\/](amd64|x64)[\\/]libusbK\.sys$' } |
            Select-Object -First 1

          $kX86Dll = Get-ChildItem $libusbKArchive -Filter 'libusbK.dll' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '(?i)[\\/]bin[\\/]dll[\\/]x86[\\/]libusbK\.dll$' } |
            Select-Object -First 1

          $kX64Dll = Get-ChildItem $libusbKArchive -Filter 'libusbK.dll' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '(?i)[\\/]bin[\\/]dll[\\/](amd64|x64)[\\/]libusbK\.dll$' } |
            Select-Object -First 1

          if (-not $kX86Sys -or -not $kX64Sys -or -not $kX86Dll -or -not $kX64Dll) {
            Get-ChildItem $libusbKArchive -Recurse -File |
              Select-Object -ExpandProperty FullName
            throw 'Could not locate the expected x86/amd64 libusbK binaries.'
          }

          Copy-Item $kX86Sys.FullName (Join-Path $libusbKRoot 'bin\sys\x86\libusbK.sys') -Force
          Copy-Item $kX64Sys.FullName (Join-Path $libusbKRoot 'bin\sys\amd64\libusbK.sys') -Force
          Copy-Item $kX86Dll.FullName (Join-Path $libusbKRoot 'bin\dll\x86\libusbK.dll') -Force
          Copy-Item $kX64Dll.FullName (Join-Path $libusbKRoot 'bin\dll\amd64\libusbK.dll') -Force

          # --------------------------------------------------------
          # Patch msvc/config.h so the build uses our local copies.
          # The upstream v1.5.1 config explicitly defines WDK_DIR,
          # LIBUSB0_DIR and LIBUSBK_DIR and uses WDF_VER=1011,
          # COINSTALLER_DIR=wdf and X64_DIR=x64.
          # --------------------------------------------------------

          $config = Join-Path $env:GITHUB_WORKSPACE 'msvc\config.h'
          if (-not (Test-Path $config)) {
            throw "Missing libwdi MSVC config: $config"
          }

          function To-CPath([string]$Path) { $Path.Replace('\', '/') }

          $wdkC = To-CPath $wdkRoot
          $libusb0C = To-CPath $libusb0Root
          $libusbKC = To-CPath (Join-Path $libusbKRoot 'bin')

          $text = Get-Content $config -Raw
          $text = [regex]::Replace($text, '(?m)^#define WDK_DIR\s+"[^"]*"\s*$', "#define WDK_DIR `"$wdkC`"")
          $text = [regex]::Replace($text, '(?m)^#define LIBUSB0_DIR\s+"[^"]*"\s*$', "#define LIBUSB0_DIR `"$libusb0C`"")
          $text = [regex]::Replace($text, '(?m)^#define LIBUSBK_DIR\s+"[^"]*"\s*$', "#define LIBUSBK_DIR `"$libusbKC`"")

          Set-Content -Path $config -Value $text -Encoding utf8NoBOM

          Write-Host 'Effective libwdi configuration:'
          Select-String $config -Pattern '^(#define (WDK_DIR|WDF_VER|COINSTALLER_DIR|X64_DIR|LIBUSB0_DIR|LIBUSBK_DIR))'

          # --------------------------------------------------------
          # Final audit before MSBuild.
          # --------------------------------------------------------

          $checks = @(
            'libwdi.sln',
            'msvc\config.h',
            'dependencies\wdk\redist\wdf\x86\WdfCoInstaller01011.dll',
            'dependencies\wdk\redist\wdf\x64\WdfCoInstaller01011.dll',
            'dependencies\wdk\redist\wdf\x86\WinUSBCoInstaller2.dll',
            'dependencies\wdk\redist\wdf\x64\WinUSBCoInstaller2.dll',
            'dependencies\libusb0\bin\x86\libusb0_x86.dll',
            'dependencies\libusb0\bin\x86\libusb0.sys',
            'dependencies\libusb0\bin\x86\install-filter.exe',
            'dependencies\libusb0\bin\amd64\libusb0.dll',
            'dependencies\libusb0\bin\amd64\libusb0.sys',
            'dependencies\libusb0\bin\amd64\install-filter.exe',
            'dependencies\libusbk\bin\sys\x86\libusbK.sys',
            'dependencies\libusbk\bin\sys\amd64\libusbK.sys',
            'dependencies\libusbk\bin\dll\x86\libusbK.dll',
            'dependencies\libusbk\bin\dll\amd64\libusbK.dll'
          )

          foreach ($rel in $checks) {
            $path = Join-Path $env:GITHUB_WORKSPACE $rel
            if (-not (Test-Path $path)) {
              throw "Missing build input: $path"
            }
            Write-Host "OK $rel"
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Verify MSBuild
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msbuild = Get-Command msbuild.exe -ErrorAction Stop
          Write-Host "MSBuild: $($msbuild.Source)"
          & $msbuild.Source -version

      - name: Build libwdi Release x64
        shell: cmd
        run: |
          msbuild libwdi.sln ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /m ^
            /verbosity:minimal

      - name: Verify wdi-simple.exe
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-PeMachine([string]$Path) {
            $b = [System.IO.File]::ReadAllBytes($Path)
            $off = [BitConverter]::ToInt32($b, 0x3c)
            [BitConverter]::ToUInt16($b, $off + 4)
          }

          $exe = Get-ChildItem $env:GITHUB_WORKSPACE -Filter 'wdi-simple.exe' -File -Recurse |
            Where-Object { $_.FullName -notlike "$env:GITHUB_WORKSPACE\dependencies\*" } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host 'No wdi-simple.exe found. Candidate executables:'
            Get-ChildItem $env:GITHUB_WORKSPACE -Filter '*.exe' -File -Recurse |
              Select-Object -ExpandProperty FullName |
              Select-Object -First 100
            throw 'wdi-simple.exe was not produced.'
          }

          $machine = Get-PeMachine $exe.FullName
          if ($machine -ne 0x8664) {
            throw ("wdi-simple.exe is not x64. PE machine = 0x{0:X4}" -f $machine)
          }

          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash

          Write-Host "Executable: $($exe.FullName)"
          Write-Host "Size: $($exe.Length) bytes"
          Write-Host "FileVersion: $($exe.VersionInfo.FileVersion)"
          Write-Host "ProductVersion: $($exe.VersionInfo.ProductVersion)"
          Write-Host "SHA-256: $hash"

          Copy-Item $exe.FullName (Join-Path $env:GITHUB_WORKSPACE 'wdi-simple.exe') -Force

          "sha256=$hash" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wdi-simple-x64-${{ github.run_number }}
          path: wdi-simple.exe
          if-no-files-found: error

      - name: Prepare release tag
        id: meta
        shell: pwsh
        run: |
          $safe = '${{ inputs.libwdi_ref }}' -replace '[^A-Za-z0-9._-]', '-'
          "safe_ref=$safe" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "wdi-simple-${{ steps.meta.outputs.safe_ref }}-${{ github.run_number }}"
          name: "wdi-simple ${{ inputs.libwdi_ref }} build #${{ github.run_number }}"
          generate_release_notes: true
          files: wdi-simple.exe
          fail_on_unmatched_files: true
          body: |
            Automated libwdi wdi-simple build.

            libwdi ref: ${{ inputs.libwdi_ref }}
            Target: x64 / Release
            Runner: windows-2022

            SHA-256:
            ${{ steps.verify.outputs.sha256 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Final summary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'wdi-simple.exe'
          if (-not (Test-Path $exe)) { throw 'Final executable is missing.' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'BUILD SUCCESSFUL'
          Write-Host '========================================'
          Write-Host "Release tag: wdi-simple-${{ steps.meta.outputs.safe_ref }}-${{ github.run_number }}"
          Write-Host "SHA-256: $hash"
