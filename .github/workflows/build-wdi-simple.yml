name: Build wdi-simple

on:
  workflow_dispatch:
    inputs:
      libwdi_ref:
        description: "libwdi tag/branch/commit"
        required: true
        default: "v1.5.1"

permissions:
  contents: write

env:
  WDK_URL: https://go.microsoft.com/fwlink/p/?LinkID=253170
  LIBUSB0_URL: https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.0/libusb-win32-bin-1.4.0.0.zip
  LIBUSBK_URL: https://github.com/mcuee/libusbk/releases/download/V3.1.0.0/libusbK-3.1.0.0-bin.7z

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ------------------------------------------------------------
      # Checkout libwdi
      # ------------------------------------------------------------
      - name: Checkout libwdi
        uses: actions/checkout@v5
        with:
          repository: pbatard/libwdi
          ref: ${{ inputs.libwdi_ref }}
          fetch-depth: 1

      # ------------------------------------------------------------
      # Download and prepare dependencies
      # ------------------------------------------------------------
      - name: Scarica e prepara i file di supporto
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "Downloading dependencies"
          Write-Host "========================================"

          # --------------------------------------------------------
          # Download
          # --------------------------------------------------------

          Write-Host "Downloading WDK redistributable..."

          Invoke-WebRequest `
            -Uri $env:WDK_URL `
            -OutFile wdk-redist.msi

          Write-Host "Downloading libusb-win32..."

          Invoke-WebRequest `
            -Uri $env:LIBUSB0_URL `
            -OutFile libusb0-redist.zip

          Write-Host "Downloading libusbK..."

          Invoke-WebRequest `
            -Uri $env:LIBUSBK_URL `
            -OutFile libusbk-redist.7z

          # --------------------------------------------------------
          # Create extraction directories
          # --------------------------------------------------------

          New-Item -ItemType Directory -Force -Path wdk | Out-Null
          New-Item -ItemType Directory -Force -Path libusb0-archive | Out-Null
          New-Item -ItemType Directory -Force -Path libusbk-archive | Out-Null

          # --------------------------------------------------------
          # Extract WDK
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Extracting WDK..."

          $wdkTarget = (Resolve-Path .).Path + '\wdk'

          $wdkProcess = Start-Process msiexec.exe `
            -ArgumentList @(
              '/a',
              (Resolve-Path wdk-redist.msi).Path,
              '/qn',
              "TARGETDIR=$wdkTarget"
            ) `
            -Wait `
            -NoNewWindow `
            -PassThru

          if ($wdkProcess.ExitCode -ne 0) {
            throw "WDK extraction failed with exit code $($wdkProcess.ExitCode)"
          }

          # --------------------------------------------------------
          # Extract libusb-win32
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Extracting libusb-win32..."

          7z x libusb0-redist.zip -olibusb0-archive -y

          # --------------------------------------------------------
          # Extract libusbK
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Extracting libusbK..."

          7z x libusbk-redist.7z -olibusbk-archive -y

          # --------------------------------------------------------
          # Normalize libusb-win32
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Normalizing libusb-win32 directory..."

          $libusb0Root = Get-ChildItem `
            -Path libusb0-archive `
            -Directory |
            Select-Object -First 1

          if (-not $libusb0Root) {
            throw "Could not find the extracted libusb-win32 directory"
          }

          if (Test-Path libusb0) {
            Remove-Item libusb0 -Recurse -Force
          }

          Move-Item `
            $libusb0Root.FullName `
            libusb0

          # --------------------------------------------------------
          # Locate libusbK.sys WITHOUT assuming its exact directory
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Searching for libusbK.sys..."

          $libusbKFiles = Get-ChildItem `
            -Path libusbk-archive `
            -Filter libusbK.sys `
            -File `
            -Recurse

          if (-not $libusbKFiles) {

            Write-Host ""
            Write-Host "ERROR: libusbK.sys was not found."

            Write-Host ""
            Write-Host "Files contained in libusbK archive:"

            Get-ChildItem `
              -Path libusbk-archive `
              -Recurse `
              -File |
              Select-Object -ExpandProperty FullName

            throw "libusbK.sys not found in libusbK archive."
          }

          Write-Host ""
          Write-Host "Found libusbK.sys files:"

          foreach ($file in $libusbKFiles) {
            Write-Host $file.FullName
          }

          # --------------------------------------------------------
          # Locate architecture-specific driver files
          # --------------------------------------------------------

          $x86Sys = $libusbKFiles |
            Where-Object {
              $_.FullName -match '[\\/]x86[\\/][^\\/]*libusbK\.sys$'
            } |
            Select-Object -First 1

          $amd64Sys = $libusbKFiles |
            Where-Object {
              $_.FullName -match '[\\/](amd64|x64)[\\/][^\\/]*libusbK\.sys$'
            } |
            Select-Object -First 1

          if (-not $x86Sys) {
            Write-Warning "Could not identify an x86-specific libusbK.sys."
          }

          if (-not $amd64Sys) {
            Write-Warning "Could not identify an amd64-specific libusbK.sys."
          }

          # --------------------------------------------------------
          # Find libusbK DLLs
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Searching for libusbK.dll..."

          $libusbKDlls = Get-ChildItem `
            -Path libusbk-archive `
            -Filter libusbK.dll `
            -File `
            -Recurse

          foreach ($dll in $libusbKDlls) {
            Write-Host $dll.FullName
          }

          # --------------------------------------------------------
          # Build normalized libusbK tree
          #
          # libwdi expects:
          #
          # libusbk\
          #   bin\
          #     sys\
          #       x86\
          #         libusbK.sys
          #       amd64\
          #         libusbK.sys
          #     dll\
          #       x86\
          #         libusbK.dll
          #       amd64\
          #         libusbK.dll
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Creating normalized libusbK directory..."

          if (Test-Path libusbk) {
            Remove-Item libusbk -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path `
            "libusbk\bin\sys\x86" | Out-Null

          New-Item -ItemType Directory -Force -Path `
            "libusbk\bin\sys\amd64" | Out-Null

          New-Item -ItemType Directory -Force -Path `
            "libusbk\bin\dll\x86" | Out-Null

          New-Item -ItemType Directory -Force -Path `
            "libusbk\bin\dll\amd64" | Out-Null

          # --------------------------------------------------------
          # Copy x86 driver
          # --------------------------------------------------------

          if ($x86Sys) {

            Copy-Item `
              $x86Sys.FullName `
              "libusbk\bin\sys\x86\libusbK.sys" `
              -Force

            Write-Host "x86 libusbK.sys copied."
          }

          # --------------------------------------------------------
          # Copy amd64 driver
          # --------------------------------------------------------

          if ($amd64Sys) {

            Copy-Item `
              $amd64Sys.FullName `
              "libusbk\bin\sys\amd64\libusbK.sys" `
              -Force

            Write-Host "amd64 libusbK.sys copied."
          }

          # --------------------------------------------------------
          # If architecture detection failed, try a more general
          # fallback based on path names.
          # --------------------------------------------------------

          if (-not (Test-Path "libusbk\bin\sys\x86\libusbK.sys")) {

            $fallbackX86 = $libusbKFiles |
              Where-Object {
                $_.FullName -match '(?i)(x86|32)'
              } |
              Select-Object -First 1

            if ($fallbackX86) {

              Copy-Item `
                $fallbackX86.FullName `
                "libusbk\bin\sys\x86\libusbK.sys" `
                -Force

              Write-Host "x86 driver copied using fallback detection."
            }
          }

          if (-not (Test-Path "libusbk\bin\sys\amd64\libusbK.sys")) {

            $fallbackAMD64 = $libusbKFiles |
              Where-Object {
                $_.FullName -match '(?i)(amd64|x64|64)'
              } |
              Select-Object -First 1

            if ($fallbackAMD64) {

              Copy-Item `
                $fallbackAMD64.FullName `
                "libusbk\bin\sys\amd64\libusbK.sys" `
                -Force

              Write-Host "amd64 driver copied using fallback detection."
            }
          }

          # --------------------------------------------------------
          # Copy DLLs
          # --------------------------------------------------------

          foreach ($dll in $libusbKDlls) {

            if ($dll.FullName -match '(?i)[\\/]x86[\\/]') {

              Copy-Item `
                $dll.FullName `
                "libusbk\bin\dll\x86\libusbK.dll" `
                -Force

              Write-Host "x86 libusbK.dll copied."
            }

            elseif ($dll.FullName -match '(?i)[\\/](amd64|x64)[\\/]') {

              Copy-Item `
                $dll.FullName `
                "libusbk\bin\dll\amd64\libusbK.dll" `
                -Force

              Write-Host "amd64 libusbK.dll copied."
            }
          }

          # --------------------------------------------------------
          # Final validation
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Validating normalized libusbK"
          Write-Host "========================================"

          $requiredFiles = @(
            "libusbk\bin\sys\x86\libusbK.sys",
            "libusbk\bin\sys\amd64\libusbK.sys"
          )

          foreach ($required in $requiredFiles) {

            if (Test-Path $required) {

              Write-Host "OK: $required"
            }
            else {

              Write-Warning "MISSING: $required"
            }
          }

          if (-not (Test-Path "libusbk\bin\sys\x86\libusbK.sys")) {

            Write-Host ""
            Write-Host "Normalized libusbK tree:"
            
            Get-ChildItem `
              -Path libusbk `
              -Recurse `
              -File |
              Select-Object -ExpandProperty FullName

            throw "Unable to create normalized x86 libusbK.sys"
          }

          if (-not (Test-Path "libusbk\bin\sys\amd64\libusbK.sys")) {

            Write-Host ""
            Write-Host "Normalized libusbK tree:"
            
            Get-ChildItem `
              -Path libusbk `
              -Recurse `
              -File |
              Select-Object -ExpandProperty FullName

            throw "Unable to create normalized amd64 libusbK.sys"
          }

          Write-Host ""
          Write-Host "libusbK normalization completed successfully."

      # ------------------------------------------------------------
      # Add MSBuild
      # ------------------------------------------------------------
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build wdi-simple
        shell: cmd
        run: |
          msbuild libwdi.sln ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /m

      # ------------------------------------------------------------
      # Verify executable
      # ------------------------------------------------------------
      - name: Verify wdi-simple.exe
        shell: pwsh
        run: |

          $exe = Get-ChildItem `
            -Path . `
            -Filter wdi-simple.exe `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "wdi-simple.exe was not produced"
          }

          Write-Host ""
          Write-Host "Found:"
          Write-Host $exe.FullName

          Write-Host ""
          Write-Host "File information:"

          Get-Item $exe.FullName |
            Select-Object FullName, Length, LastWriteTime

          Write-Host ""
          Write-Host "Version information:"

          (Get-Item $exe.FullName).VersionInfo |
            Select-Object `
              FileVersion,
              ProductVersion,
              CompanyName,
              ProductName

      # ------------------------------------------------------------
      # Verify target hardware ID
      # ------------------------------------------------------------
      - name: Verify target hardware ID
        shell: pwsh
        run: |

          $exe = Get-ChildItem `
            -Path . `
            -Filter wdi-simple.exe `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "wdi-simple.exe not found"
          }

          Write-Host ""
          Write-Host "Checking binary for VID_30C9 / PID_0013..."

          $bytes = [System.IO.File]::ReadAllBytes(
            $exe.FullName
          )

          $ascii = [System.Text.Encoding]::ASCII.GetString(
            $bytes
          )

          if (
            $ascii -notmatch 'VID_30C9' -or
            $ascii -notmatch 'PID_0013'
          ) {

            Write-Warning `
              "VID_30C9 / PID_0013 was not found as a plain ASCII string."

            Write-Host `
              "This does not necessarily mean the device ID is absent."
          }
          else {

            Write-Host `
              "VID_30C9 and PID_0013 found in binary."
          }

      # ------------------------------------------------------------
      # SHA-256
      # ------------------------------------------------------------
      - name: Calculate SHA-256
        id: hash
        shell: pwsh
        run: |

          $exe = Get-ChildItem `
            -Path . `
            -Filter wdi-simple.exe `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "wdi-simple.exe not found"
          }

          $hash = (
            Get-FileHash `
              $exe.FullName `
              -Algorithm SHA256
          ).Hash

          Write-Host ""
          Write-Host "SHA-256:"
          Write-Host $hash

          "sha256=$hash" >> $env:GITHUB_OUTPUT

      # ------------------------------------------------------------
      # Prepare release asset
      # ------------------------------------------------------------
      - name: Prepare release asset
        shell: pwsh
        run: |

          $exe = Get-ChildItem `
            -Path . `
            -Filter wdi-simple.exe `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "wdi-simple.exe not found"
          }

          Copy-Item `
            $exe.FullName `
            "$env:GITHUB_WORKSPACE\wdi-simple.exe" `
            -Force

      # ------------------------------------------------------------
      # Create GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wdi-simple-${{ inputs.libwdi_ref }}-${{ github.run_number }}
          name: "wdi-simple ${{ inputs.libwdi_ref }} build #${{ github.run_number }}"
          generate_release_notes: true
          files: |
            wdi-simple.exe

          body: |
            Automated wdi-simple build.

            libwdi ref: ${{ inputs.libwdi_ref }}

            SHA-256:
            ${{ steps.hash.outputs.sha256 }}

            Target hardware ID:
            VID_30C9
            PID_0013

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Final information
      # ------------------------------------------------------------
      - name: Print build information
        shell: pwsh
        run: |

          $exe = Join-Path `
            $env:GITHUB_WORKSPACE `
            'wdi-simple.exe'

          if (-not (Test-Path $exe)) {
            throw "Release asset not found"
          }

          $hash = (
            Get-FileHash `
              $exe `
              -Algorithm SHA256
          ).Hash

          Write-Host ""
          Write-Host "========================================"
          Write-Host "BUILD SUCCESSFUL"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "WDI_SIMPLE_URL:"
          Write-Host "https://github.com/${{ github.repository }}/releases/download/wdi-simple-${{ inputs.libwdi_ref }}-${{ github.run_number }}/wdi-simple.exe"

          Write-Host ""
          Write-Host "WDI_SIMPLE_SHA256:"
          Write-Host $hash

          Write-Host ""
