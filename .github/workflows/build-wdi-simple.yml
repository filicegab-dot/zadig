
name: Build wdi-simple

on:
  workflow_dispatch:
    inputs:
      libwdi_ref:
        description: "libwdi tag/branch/commit"
        required: true
        default: "v1.5.1"

permissions:
  contents: write

env:
  WDK_REDIST_URL: "https://go.microsoft.com/fwlink/p/?LinkID=253170"
  LIBUSB0_URL: "https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.0/libusb-win32-bin-1.4.0.0.zip"
  LIBUSBK_URL: "https://github.com/mcuee/libusbk/releases/download/V3.1.0.0/libusbK-3.1.0.0-bin.7z"

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ============================================================
      # CHECKOUT LIBWDI
      # ============================================================

      - name: Checkout libwdi
        uses: actions/checkout@v5
        with:
          repository: pbatard/libwdi
          ref: ${{ inputs.libwdi_ref }}
          fetch-depth: 1

      # ============================================================
      # INSTALL WDK 8 REDISTRIBUTABLE COMPONENTS
      #
      # libwdi v1.5.1 expects the legacy:
      #
      # C:\Program Files (x86)\Windows Kits\8.0\redist\wdf
      #
      # Microsoft documents LinkID=253170 as the WDK 8
      # Redistributable Components package.
      # ============================================================

      - name: Install WDK 8 redistributable components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "Installing WDK 8 Redistributable Components"
          Write-Host "========================================"

          $msi = Join-Path $env:GITHUB_WORKSPACE "wdfcoinstaller.msi"

          Write-Host ""
          Write-Host "Downloading Microsoft WDK 8 redistributable package..."

          Invoke-WebRequest `
            -Uri $env:WDK_REDIST_URL `
            -OutFile $msi

          if (-not (Test-Path $msi)) {
            throw "WDK redistributable MSI was not downloaded."
          }

          $size = (Get-Item $msi).Length

          Write-Host ""
          Write-Host "Downloaded MSI:"
          Write-Host $msi
          Write-Host "Size: $size bytes"

          if ($size -lt 100000) {
            throw "Downloaded WDK package is unexpectedly small."
          }

          # ----------------------------------------------------------
          # Install using administrative MSI installation.
          #
          # TARGETDIR is deliberately the legacy Windows Kits 8.0
          # location expected by libwdi.
          # ----------------------------------------------------------

          $targetRoot = "C:\Program Files (x86)\Windows Kits\8.0"

          Write-Host ""
          Write-Host "Installing into:"
          Write-Host $targetRoot

          $arguments = @(
            "/a"
            "`"$msi`""
            "/qn"
            "TARGETDIR=`"$targetRoot`""
          )

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host ""
          Write-Host "msiexec exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            throw "WDK redistributable installation failed with exit code $($process.ExitCode)."
          }

          # ----------------------------------------------------------
          # Verify WDF directory
          # ----------------------------------------------------------

          $wdfRoot = Join-Path $targetRoot "redist\wdf"

          Write-Host ""
          Write-Host "Expected WDF directory:"
          Write-Host $wdfRoot

          if (-not (Test-Path $wdfRoot)) {
            throw "WDK 8 redist\wdf directory was not created."
          }

          Write-Host ""
          Write-Host "WDF directory contents:"

          Get-ChildItem `
            -Path $wdfRoot `
            -Recurse `
            -File |
            Select-Object -ExpandProperty FullName

          # ----------------------------------------------------------
          # Verify exact files required by libwdi
          # ----------------------------------------------------------

          $wdfX86 = Join-Path $wdfRoot "x86\WdfCoInstaller01011.dll"
          $wdfX64 = Join-Path $wdfRoot "x64\WdfCoInstaller01011.dll"

          $winusbX86 = Join-Path $wdfRoot "x86\winusbcoinstaller2.dll"
          $winusbX64 = Join-Path $wdfRoot "x64\winusbcoinstaller2.dll"

          Write-Host ""
          Write-Host "Checking required WDF files..."

          if (-not (Test-Path $wdfX86)) {
            throw "Missing x86 WdfCoInstaller01011.dll: $wdfX86"
          }

          if (-not (Test-Path $wdfX64)) {
            throw "Missing x64 WdfCoInstaller01011.dll: $wdfX64"
          }

          Write-Host "OK: $wdfX86"
          Write-Host "OK: $wdfX64"

          Write-Host ""
          Write-Host "Checking WinUSB co-installers..."

          if (-not (Test-Path $winusbX86)) {
            throw "Missing x86 winusbcoinstaller2.dll: $winusbX86"
          }

          if (-not (Test-Path $winusbX64)) {
            throw "Missing x64 winusbcoinstaller2.dll: $winusbX64"
          }

          Write-Host "OK: $winusbX86"
          Write-Host "OK: $winusbX64"

          Write-Host ""
          Write-Host "WDK 8 redistributable components installed successfully."

      # ============================================================
      # DOWNLOAD AND PREPARE LIBUSB-WIN32 / LIBUSBK
      # ============================================================

      - name: Download and prepare libusb dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "Downloading libusb dependencies"
          Write-Host "========================================"

          # ----------------------------------------------------------
          # Download libusb-win32
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Downloading libusb-win32..."

          Invoke-WebRequest `
            -Uri $env:LIBUSB0_URL `
            -OutFile libusb0-redist.zip

          # ----------------------------------------------------------
          # Download libusbK
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Downloading libusbK..."

          Invoke-WebRequest `
            -Uri $env:LIBUSBK_URL `
            -OutFile libusbk-redist.7z

          # ----------------------------------------------------------
          # Create extraction directories
          # ----------------------------------------------------------

          New-Item `
            -ItemType Directory `
            -Force `
            -Path libusb0-archive |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path libusbk-archive |
            Out-Null

          # ----------------------------------------------------------
          # Extract libusb-win32
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Extracting libusb-win32..."

          7z x `
            libusb0-redist.zip `
            -olibusb0-archive `
            -y

          # ----------------------------------------------------------
          # Extract libusbK
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Extracting libusbK..."

          7z x `
            libusbk-redist.7z `
            -olibusbk-archive `
            -y

          # ----------------------------------------------------------
          # Normalize libusb-win32
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Normalizing libusb-win32 directory..."

          $libusb0Root = Get-ChildItem `
            -Path libusb0-archive `
            -Directory |
            Select-Object -First 1

          if (-not $libusb0Root) {
            throw "Could not find extracted libusb-win32 directory."
          }

          if (Test-Path libusb0) {
            Remove-Item `
              libusb0 `
              -Recurse `
              -Force
          }

          Move-Item `
            $libusb0Root.FullName `
            libusb0

          # ----------------------------------------------------------
          # Locate libusbK.sys
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Searching for libusbK.sys..."

          $libusbKFiles = Get-ChildItem `
            -Path libusbk-archive `
            -Filter "libusbK.sys" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $libusbKFiles) {

            Write-Host ""
            Write-Host "Files contained in libusbK archive:"

            Get-ChildItem `
              -Path libusbk-archive `
              -Recurse `
              -File |
              Select-Object -ExpandProperty FullName

            throw "libusbK.sys not found in libusbK archive."
          }

          Write-Host ""
          Write-Host "Found libusbK.sys:"

          $libusbKFiles |
            ForEach-Object {
              Write-Host $_.FullName
            }

          # ----------------------------------------------------------
          # Identify x86 and amd64
          # ----------------------------------------------------------

          $x86Sys = $libusbKFiles |
            Where-Object {
              $_.FullName -match '(?i)[\\/]x86[\\/][^\\/]*libusbK\.sys$'
            } |
            Select-Object -First 1

          $amd64Sys = $libusbKFiles |
            Where-Object {
              $_.FullName -match '(?i)[\\/](amd64|x64)[\\/][^\\/]*libusbK\.sys$'
            } |
            Select-Object -First 1

          # ----------------------------------------------------------
          # Create normalized libusbK tree
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Creating normalized libusbK directory..."

          if (Test-Path libusbk) {
            Remove-Item `
              libusbk `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "libusbk\bin\sys\x86" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "libusbk\bin\sys\amd64" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "libusbk\bin\dll\x86" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "libusbk\bin\dll\amd64" |
            Out-Null

          # ----------------------------------------------------------
          # Copy drivers
          # ----------------------------------------------------------

          if ($x86Sys) {

            Copy-Item `
              $x86Sys.FullName `
              "libusbk\bin\sys\x86\libusbK.sys" `
              -Force

            Write-Host "Copied x86 libusbK.sys."
          }

          if ($amd64Sys) {

            Copy-Item `
              $amd64Sys.FullName `
              "libusbk\bin\sys\amd64\libusbK.sys" `
              -Force

            Write-Host "Copied amd64 libusbK.sys."
          }

          # ----------------------------------------------------------
          # Fallback x86
          # ----------------------------------------------------------

          if (-not (Test-Path "libusbk\bin\sys\x86\libusbK.sys")) {

            $fallbackX86 = $libusbKFiles |
              Where-Object {
                $_.FullName -match '(?i)(x86|32)'
              } |
              Select-Object -First 1

            if ($fallbackX86) {

              Copy-Item `
                $fallbackX86.FullName `
                "libusbk\bin\sys\x86\libusbK.sys" `
                -Force

              Write-Host "Copied x86 driver using fallback detection."
            }
          }

          # ----------------------------------------------------------
          # Fallback amd64
          # ----------------------------------------------------------

          if (-not (Test-Path "libusbk\bin\sys\amd64\libusbK.sys")) {

            $fallbackAMD64 = $libusbKFiles |
              Where-Object {
                $_.FullName -match '(?i)(amd64|x64|64)'
              } |
              Select-Object -First 1

            if ($fallbackAMD64) {

              Copy-Item `
                $fallbackAMD64.FullName `
                "libusbk\bin\sys\amd64\libusbK.sys" `
                -Force

              Write-Host "Copied amd64 driver using fallback detection."
            }
          }

          # ----------------------------------------------------------
          # Locate DLLs
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Searching for libusbK.dll..."

          $libusbKDlls = Get-ChildItem `
            -Path libusbk-archive `
            -Filter "libusbK.dll" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          $libusbKDlls |
            ForEach-Object {
              Write-Host $_.FullName
            }

          # ----------------------------------------------------------
          # Copy DLLs
          # ----------------------------------------------------------

          foreach ($dll in $libusbKDlls) {

            if ($dll.FullName -match '(?i)[\\/]x86[\\/]') {

              Copy-Item `
                $dll.FullName `
                "libusbk\bin\dll\x86\libusbK.dll" `
                -Force
            }
            elseif ($dll.FullName -match '(?i)[\\/](amd64|x64)[\\/]') {

              Copy-Item `
                $dll.FullName `
                "libusbk\bin\dll\amd64\libusbK.dll" `
                -Force
            }
          }

          # ----------------------------------------------------------
          # Validate
          # ----------------------------------------------------------

          if (-not (Test-Path "libusbk\bin\sys\x86\libusbK.sys")) {
            throw "Normalized x86 libusbK.sys is missing."
          }

          if (-not (Test-Path "libusbk\bin\sys\amd64\libusbK.sys")) {
            throw "Normalized amd64 libusbK.sys is missing."
          }

          Write-Host ""
          Write-Host "libusbK preparation completed successfully."

      # ============================================================
      # SHOW WDK PATHS USED BY LIBWDI
      # ============================================================

      - name: Verify libwdi dependency paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $wdkRoot = "C:\Program Files (x86)\Windows Kits\8.0\redist\wdf"

          Write-Host "========================================"
          Write-Host "Verifying libwdi dependency paths"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "WDK:"
          Write-Host $wdkRoot

          Write-Host ""
          Write-Host "Contents:"

          Get-ChildItem `
            -Path $wdkRoot `
            -Recurse `
            -File |
            Select-Object -ExpandProperty FullName

          Write-Host ""
          Write-Host "Required WdfCoInstaller files:"

          $required = @(
            "$wdkRoot\x86\WdfCoInstaller01011.dll",
            "$wdkRoot\x64\WdfCoInstaller01011.dll"
          )

          foreach ($file in $required) {

            if (-not (Test-Path $file)) {
              throw "Required file missing: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "All libwdi dependency paths are ready."

      # ============================================================
      # MSBUILD
      # ============================================================

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build libwdi
        shell: cmd
        run: |
          msbuild libwdi.sln ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /m

      # ============================================================
      # VERIFY OUTPUT
      # ============================================================

      - name: Verify wdi-simple.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Get-ChildItem `
            -Path . `
            -Filter "wdi-simple.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $exe) {
            throw "wdi-simple.exe was not produced."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "wdi-simple.exe FOUND"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Path:"
          Write-Host $exe.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($exe.Length) bytes"

          Write-Host ""
          Write-Host "Version:"
          Write-Host $exe.VersionInfo.FileVersion

      # ============================================================
      # SHA256
      # ============================================================

      - name: Calculate SHA-256
        id: hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Get-ChildItem `
            -Path . `
            -Filter "wdi-simple.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $exe) {
            throw "wdi-simple.exe was not found."
          }

          $hash = (
            Get-FileHash `
              -Path $exe.FullName `
              -Algorithm SHA256
          ).Hash

          Write-Host ""
          Write-Host "SHA-256:"
          Write-Host $hash

          "sha256=$hash" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append

      # ============================================================
      # PREPARE RELEASE ASSET
      # ============================================================

      - name: Prepare release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Get-ChildItem `
            -Path . `
            -Filter "wdi-simple.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $exe) {
            throw "wdi-simple.exe was not found."
          }

          Copy-Item `
            -Path $exe.FullName `
            -Destination "$env:GITHUB_WORKSPACE\wdi-simple.exe" `
            -Force

      # ============================================================
      # CREATE GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "wdi-simple-${{ inputs.libwdi_ref }}-${{ github.run_number }}"
          name: "wdi-simple ${{ inputs.libwdi_ref }} build #${{ github.run_number }}"
          generate_release_notes: true

          files: |
            wdi-simple.exe

          body: |
            Automated libwdi wdi-simple build.

            libwdi ref:
            ${{ inputs.libwdi_ref }}

            SHA-256:
            ${{ steps.hash.outputs.sha256 }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # FINAL INFORMATION
      # ============================================================

      - name: Print build information
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Join-Path `
            $env:GITHUB_WORKSPACE `
            "wdi-simple.exe"

          if (-not (Test-Path $exe)) {
            throw "Release executable not found."
          }

          $hash = (
            Get-FileHash `
              -Path $exe `
              -Algorithm SHA256
          ).Hash

          Write-Host ""
          Write-Host "========================================"
          Write-Host "BUILD SUCCESSFUL"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Release:"
          Write-Host "https://github.com/${{ github.repository }}/releases/tag/wdi-simple-${{ inputs.libwdi_ref }}-${{ github.run_number }}"

          Write-Host ""
          Write-Host "SHA-256:"
          Write-Host $hash
